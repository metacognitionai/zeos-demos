# Weekly, grouped, so a week's bumps arrive as one pull request per ecosystem rather
# than a dozen. The uv entry uses a wildcard so a new demonstration is covered the moment
# it has a uv.lock, as the CI workflow finds demonstrations rather than listing them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directories: ["/*"]
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    ignore:
      # Ruff is pinned in two places that must move together (the lockfile and the
      # pre-commit rev); a lone bump here would only desync them. Ruff bumps are
      # deliberate and manual.
      - dependency-name: ruff
