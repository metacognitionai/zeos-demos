[project]
name = "zeos-blocks"
version = "0.1.0"
description = "Blocks world written as a ZEOS descriptor tree"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "zeos",
]

[project.optional-dependencies]
# The Claude seat only. The stub planner needs neither a key nor a network, which is
# what lets the demonstration run and be tested without either.
claude = ["anthropic>=1.0"]

[project.scripts]
zeos-blocks = "zeos_blocks.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv.sources]
# A git source, not a release: this demo needs kernel work -- front doors on a pipe,
# utterance arguments carried to the job, case-local capability schemas -- that has
# landed on main but is not in a published wheel yet. The lockfile pins the commit
# `uv lock` resolved; `uv lock --upgrade-package zeos` moves it.
zeos = { git = "https://github.com/metacognitionai/zeos", branch = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zeos_blocks"]

[tool.hatch.build.targets.wheel.force-include]
"src/zeos_blocks/stacker_body.md" = "zeos_blocks/stacker_body.md"
"src/zeos_blocks/noticed.md" = "zeos_blocks/noticed.md"
"src/zeos_blocks/tidy_body.md" = "zeos_blocks/tidy_body.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
