[project]
name = "zeos-stretch"
version = "0.1.0"
description = "Stretch in the RoboZeos Atrium: one body shared by four ZEOS behaviours, with a simulated VLA"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "zeos",
]

[project.optional-dependencies]
# The Claude seat only. The tapes need neither a key nor a network, which is what lets
# the demonstration run and be tested without either.
claude = ["anthropic>=1.0"]

[project.scripts]
zeos-stretch = "zeos_stretch.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv.sources]
# A git source, not a release: this demo needs kernel work -- reports attributed to the
# job whose command caused them, every job.state transition journalled -- that has
# landed on main but is not in a published wheel yet. The lockfile pins the commit
# `uv lock` resolved; `uv lock --upgrade-package zeos` moves it.
zeos = { git = "https://github.com/metacognitionai/zeos", branch = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zeos_stretch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
