[project]
name = "zeos-stretch"
version = "0.1.0"
description = "Stretch in the RoboZeos Atrium: one body shared by four ZEOS behaviours, with a simulated VLA"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "zeos",
]

[project.optional-dependencies]
# The Claude seat only. The tapes need neither a key nor a network, which is what lets
# the demonstration run and be tested without either.
claude = ["anthropic>=1.0"]

[project.scripts]
zeos-stretch = "zeos_stretch.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv.sources]
# LOCAL TEST ONLY: the kernel checkout beside this repository, on the branch carrying
# the kernel work this demo needs (reports attributed to the job whose command caused
# them, and every job.state transition journalled). Before this is committed it becomes
# the git source the other demos use, once that work is on zeos main.
zeos = { path = "../../zeos-internal", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zeos_stretch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
