[project]
name = "zeos-chat"
version = "0.1.0"
description = "A chatbot written as a ZEOS descriptor tree"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "zeos",
]

[project.optional-dependencies]
# The Claude seat only. The scripted case needs neither a key nor a network, which
# is the whole point of staging it first.
claude = ["anthropic>=1.0"]

[project.scripts]
zeos-chat = "zeos_chat.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv.sources]
# A git source, not a release: this demo needs kernel work -- front doors on a
# pipe, job parameters, capability schemas, a spawn that carries its target --
# that has landed on main but is not in a published wheel yet. The lockfile pins
# the commit `uv lock` resolved; `uv lock --upgrade-package zeos` moves it.
zeos = { git = "https://github.com/metacognitionai/zeos", branch = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zeos_chat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
