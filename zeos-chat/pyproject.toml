[project]
name = "zeos-chat"
version = "0.1.0"
description = "A chatbot written as a ZEOS descriptor tree"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "zeos",
]

[project.optional-dependencies]
# The Claude seat only. The scripted case needs neither a key nor a network, which
# is the whole point of staging it first.
claude = ["anthropic>=1.0"]

[project.scripts]
zeos-chat = "zeos_chat.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv.sources]
# A path source, not a release: this demo needs kernel work that is not in a
# published wheel yet (see PLAN.md -- C2, C4, C8 and the spawn-target gap). It
# assumes zeos-internal is checked out beside zeos_demos, which is how the two
# are worked on. Swap for a pinned `zeos>=0.2` once that work ships.
zeos = { path = "../../zeos-internal", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zeos_chat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
