# The conversation's wiring.
#
# Ring and principal are assigned here, by the kernel, from provenance -- never claimed
# by the content that arrives. Most of this list is TRUSTED, and the two exceptions are
# where the interesting half of the case lives: `web.results` carries the outside world
# in, and `guest.intercom` carries somebody who is not the owner. Both are EXTERNAL, and
# a job that reads either falls to that level.
#
# There are three kinds of pipe and this case uses all three. An ordinary pipe carries a
# *message*: appended, read once, gone. An actuator -- declared by `world_object:` --
# carries a *value*: it latches and becomes world state. A sink -- declared by
# `sink: true` -- carries a *history*: appended, and drained by the driver for the
# world. A pipe cannot be both an actuator and a sink; the loader rejects that.

# -- the person ---------------------------------------------------------------
#
# **Two pipes carry one message, and it is a correction rather than a convenience.**
# The obvious arrangement binds `converse.stdin` to `user.messages` and fires the
# `user-spoke` vector from that same pipe. Those two cannot both hold:
# `Kernel._dispatch_handler` calls `take_write()` on the vector's source, so the firing
# *takes* the message and hands it to the handler as its payload. The conversation is
# woken by the same write, finds the pipe empty when it retries its read, and parks
# again having seen nothing. One pipe, and the message reaches the handler and nobody
# else.
#
# So the content and the interrupt are separate lines. `user.messages` carries the words
# and is what the conversation reads. `user.arrivals` is a doorbell: the adapter writes a
# single fixed token to it for every message, and that token says only *that* somebody
# spoke. The message itself is never copied, so it exists in exactly one place and the
# two lines cannot disagree -- which they could if the adapter wrote the text twice and
# one of the two deliveries were refused for want of room.
#
# This is the shape coop-count already uses, with `keys.interrupt` carrying the event and
# `keys.number` carrying the content the handler reads. What is unusual about a
# conversation is only that the same text would serve as both, which is what makes the
# duplication tempting.
#
# Which of the two mechanisms matters on a given message is then the *kernel's* decision
# and not the adapter's: if the conversation is parked it simply wakes and answers, and if
# it is mid-answer the handler preempts it at priority 10. Nothing in the adapter has to
# ask "is it busy?", which is exactly the application-level branch a descriptor tree
# exists to remove.
#
# `capacity` is a hard limit at both ends, and sizing it by guesswork produces a fault at
# the worst possible moment. A device delivery that does not fit is refused whole to the
# driver rather than truncated (#58), so a long pasted message needs a roomy inbound
# pipe; a job's write larger than the whole pipe is a capability fault rather than a wait
# (#75), so a long reply needs a roomy sink.

- name: user.messages
  ring: TRUSTED
  principal: user
  device: true
  capacity: 8192

# The doorbell. Small on purpose: what arrives is the fact that somebody spoke, and the
# fact has no arguments. It still has to be large enough to hold several unanswered rings
# at once, because `user-spoke` declares `policy: queue` and a throttle defers rather
# than discards -- three messages typed in quick succession are three writes waiting here
# for three firings.
- name: user.arrivals
  ring: TRUSTED
  principal: user
  device: true
  capacity: 64

# The reflex line. A write here is not data for anyone to read -- it is an interrupt, and
# the handler it fires does its whole work in its frontmatter. Small on purpose: what
# arrives is the fact that somebody said stop, and the fact has no arguments.
- name: user.cancel
  ring: TRUSTED
  principal: user
  device: true
  capacity: 64

# The way out. A sink is drained by the driver after every tick and handed to the
# `on_drain` callback, which in the web application is the reply arriving in the browser.
# Before sink pipes existed the only outbound path was an actuator, which latches and so
# holds a current value rather than a history -- no use at all for a conversation, where
# every turn must survive the next one.
- name: user.replies
  ring: TRUSTED
  principal: user
  sink: true
  capacity: 8192

# -- the front doors ----------------------------------------------------------
#
# A pipe with an `utterance_source` is a door somebody speaks through. Text written to it
# is not data for a job to read: the kernel compiles it against the phrasing table the
# descriptors declare, dispatches the job that matches, and narrows that job to the
# speaker's envelope. Nothing lands on the pipe, and no job can read what was said.
#
# **Identity is the door's, not the sentence's.** That is the whole point of having two.
# A speaker cannot claim to be the owner, because nothing they write is consulted about
# who they are -- the pipe they reached decides it before a word is compiled. The same
# sentence through these two doors produces the same job with different authority.
#
# `reply_to` is required and the lint rejects a door without one: a door somebody can
# speak into but which cannot answer is a dead end.

- name: owner.console
  ring: TRUSTED
  principal: user
  device: true
  utterance_source: owner
  reply_to: user.replies
  capacity: 4096

# Ring EXTERNAL because that is what it is: an input from outside, and content arriving
# here carries that ring wherever it goes.
- name: guest.intercom
  ring: EXTERNAL
  principal: user
  device: true
  utterance_source: guest
  reply_to: user.replies
  capacity: 4096

# -- the actuators ------------------------------------------------------------
#
# **One actuator, one world object.** An actuator write latches into exactly one object,
# so one pipe cannot maintain two of them -- which is why there are two pipes here and
# not one `actuators.session`. An earlier draft of this case declared
# `writes: [session.topic]` on `converse` with no actuator to write it through, and
# mapped `session.pending_task` as well, which nothing in the case could set. The topic is `converse`'s to write; the
# pending task belongs to `deep-research`, through an actuator of its own.

- name: actuators.topic
  ring: TRUSTED
  principal: device
  world_object: session.topic
  capacity: 256

- name: actuators.task
  ring: TRUSTED
  principal: device
  world_object: session.pending_task
  capacity: 256

# What to send, and how the service is asked for.
#
# The letter goes here and the *request* goes through a front door, which is the only
# route to this service: a vector used to dispatch it as well, and a vector dispatches a
# job the kernel owns -- carrying the kernel's authority, which is all of it. That made
# the capability on `mail.outbox` unreachable, so the one consequential effect in the
# system had a way around the one check that guards it.
#
# What to send. Read by `send-email`, and roomy because it holds a subject and a whole
# transcript.
- name: mail.letters
  ring: TRUSTED
  principal: user
  device: true
  capacity: 4096

# The consequential one. Simulated unless `MAIL_LIVE` is set: the write latches into
# `mail.sent` and the demo shows what would have been sent. A real send sits behind a flag,
# because the point of the capability check is watching it refuse an effect that would
# otherwise happen -- and because a demonstration that mails somebody on first run is not
# one anybody wants twice.
#
# An actuator rather than a sink, and that is load-bearing. A sink is a history the driver
# empties; an actuator is a value that latches into world state, and `mail.sent` *is* the
# world changing. The adapter that transmits watches for the latch.
- name: mail.outbox
  ring: TRUSTED
  principal: device
  world_object: mail.sent
  capacity: 1024

# What the long job found, for anything that wants to *act* on it.
#
# Not the same thing as `user.replies`, and the difference is the one this file opens with.
# A sink is a history the driver empties for a person to read; this is an ordinary pipe,
# and a job reads it. The findings go to both because they have two audiences.
#
# Ring TRUSTED, and that changes nothing about what arrives here. A pipe does not launder
# its writer: content written by a job at integrity 3 reaches its reader at 3 however
# trusted the pipe, so a job that reads this after `deep-research` has been out reading
# the web is demoted exactly as `deep-research` was. Trust is not restored by being passed
# along; only an endorsement restores it, and nothing here endorses.
- name: research.report
  ring: TRUSTED
  principal: peer_job
  capacity: 8192

# -- the outside world --------------------------------------------------------
#
# Retrieval, and the only thing in this case that is genuinely untrusted.
#
# `web.results` is EXTERNAL, and that ring is the whole mechanism. A job that reads from
# here falls to the integrity of what it read -- the low-water-mark rule, applied by the
# kernel without the job cooperating or even being told. `deep-research` goes out and
# reads, so `deep-research` is demoted, and what it writes afterwards carries that with
# it.
#
# Nothing inspects what arrives. A retrieved page that tries to issue instructions gets
# exactly the treatment a harmless one does, because the refusal that follows is about
# where the text came from and not about what it says. Scanning it would be the weaker
# guarantee: it would work only for the phrasings somebody thought of.

- name: web.queries
  ring: TRUSTED
  principal: device
  sink: true
  capacity: 1024

- name: web.results
  ring: EXTERNAL
  principal: device
  device: true
  capacity: 8192

# -- the model ----------------------------------------------------------------
#
# A job reaches the model the way it reaches any other device: it writes a request and
# blocks on a reply. A tool call *is* a pipe write plus a blocking read, and the job is
# descheduled and costs nothing while it waits; this is that, with the model as the tool.
#
# What it buys is not a faster model but an awake kernel. A job parked on a reply is
# `JobBlocked`: the scheduler runs whatever else is runnable, a vector still fires, a
# reflex still preempts. A seat that calls the model from inside its decode cannot offer
# any of that, because the whole kernel is inside the call.
#
# A pair per descriptor rather than one shared pair. Two jobs may be waiting at once --
# that is the entire point of the long job running under the conversation -- and a reply
# has to find the one that asked. Routing by pipe needs no correlation id: the pipe is the
# address.
#
# The requests are sinks, drained by the driver. The replies are device pipes, delivered
# by it. Both directions are ordinary.

- name: llm.converse.requests
  ring: TRUSTED
  principal: device
  sink: true
  capacity: 8192

- name: llm.converse.replies
  ring: TRUSTED
  principal: device
  device: true
  capacity: 8192

# The long job's own pair. Note the ring: what comes back is still TRUSTED here, because
# the model is being asked to compose, not to fetch. A model's own words are not what
# makes a job dirty -- `web.results` above is, and by the time the long job asks this one
# to write up what it found, it has already been demoted by having read that.
- name: llm.research.requests
  ring: TRUSTED
  principal: device
  sink: true
  capacity: 8192

- name: llm.research.replies
  ring: TRUSTED
  principal: device
  device: true
  capacity: 8192
