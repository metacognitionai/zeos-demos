# Mirrors what CI runs, so a failure shows up before a push. Ruff reads each
# demonstration's own [tool.ruff] from its pyproject.toml, so one config at the root
# serves every demonstration. Hook repos are pinned by SHA, and the ruff hook to the
# version in zeos-chat/uv.lock, so the hook and CI cannot disagree about formatting.
#
#   uvx pre-commit install      # once, to enable the git hook
#   uvx pre-commit run -a       # run on the whole tree
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 2eeb5678de71a00c0902cbda7105d328432f72cb  # v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
        types_or: [python, pyi, jupyter]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files
  - repo: https://github.com/codespell-project/codespell
    rev: 63c8f8312b7559622c0d82815639671ae42132ac  # v2.4.1
    hooks:
      - id: codespell
        # Australian English, per AGENTS.md: these are spellings, not typos.
        args: [--ignore-words-list=fulfilment,unparseable,licence,behaviour,colour,favour,honour,recognise,realise,organise,summarise,initialise,serialise,analyse,centre,catalogue,programme]
        exclude: uv\.lock$
